name: Pruebas PetCare con PostgreSQL
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: petcare
          POSTGRES_USER: petcare
          # Solo este contenedor efímero de CI: producción usa SCRAM y contraseña.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petcare -d petcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.txt
      - run: .venv/bin/python scripts/configurar_local.py
      - run: bash scripts/verificar.sh
      - run: node --test tests/calendar-time.cjs
