# Contexto http. Sustituir IP_PUBLICA_O_DOMINIO antes de instalar.
limit_req_zone $binary_remote_addr zone=petcare_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=petcare_api:10m rate=10r/s;
map $uri $petcare_log_path {
    default $uri;
    ~^/recuperar/ /recuperar/redacted;
}
log_format petcare_safe '$remote_addr [$time_local] "$request_method $petcare_log_path" $status $body_bytes_sent';
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 80;
    server_name IP_PUBLICA_O_DOMINIO;
    server_tokens off;
    access_log /var/log/nginx/petcare-access.log petcare_safe;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }
    location /static/ {
        alias /srv/petcare/staticfiles/;
        expires 7d;
        access_log off;
        limit_except GET { deny all; }
    }
    location ~ ^/(login/|admin/login/|registro/|recuperar/) {
        limit_req zone=petcare_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 30s;
    }
    location / {
        limit_req zone=petcare_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_send_timeout 30s;
    }
}
